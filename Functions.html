        function printEvenNumbers(){

        function factorial(a){
            if(a < 1){
                return 1;
            }

            var fact = 1;
            for(var i =2; i<= a; i++){
                fact *= i
            }
            return fact;
        }
        var total = factorial(10)
        console.log(total);
