<!DOCTYPE html>
<html lang="en">
<head>

    <title>Function Binding And Closure</title>
</head>
<body>
    <demo id="demo"></demo>
    <script>
        let animal = {
            name : 'Lion',
            color : 'Yellow'
        }
        // console.log(animal.color);

        let birds = {
            name : 'parrot',
            color : 'Green'
        }

        function print(){
            console.log(this.name + " " + this.color);
        }
        let animalName = print.bind(animal)
        let birdName = print.bind(birds)

        // animalName();
        // birdName();
        

        //PRACTICE QUE 1 - When used in an object method,thisrefers to theobject. Create an object, where you havemultiple properties and values, and define a function as one value. With help ofthiskeywordaccess the values of properties in that function. Invoke the function to display the data from theobject
        var person = {
            firstName : 'Pooja',
            lastName : 'Getme',
            fullName : function(){
                return this.firstName + " " + this.lastName
            }
        }
        // document.getElementById('demo').innerHTML = person.fullName()

        
    </script>
</body>
</html>
