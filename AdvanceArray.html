<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Array</title>
</head>
<body>
    <script>
        let students = [
            ['Rishi', 'BE', 80, 'pass' ],
            ['Yogesh', 'BBA',70, 'pass'],
            ['Pooja', 'MA', 60,'pass']
        ];

        console.log(students[0][4]='passed with highest marks') //adding elements in last
        let end = students[2].push('passed with lowest marks');  //adding elements using push method in the last
        console.log(end);
        
        let newArray = students.push(['Mayuri', 'BSC', 75, 'pass']); //adding new array using push method
        console.log(newArray);
        

        for(var i=0;i<students.length;i++){
            let student = students[i];
            for(var j=0; j<student.length;j++){
                console.log(student[j]);
                
            }
            console.log('***************');
            
        }

        let deleteArray =students.pop()
        console.log(deleteArray);

        //ARRAY as OBJECT
       let person = new Array();
       person['Rishi']='VII'
       console.log(person.Rishi); //Access the element using name like object
       
      //REFERENTIAL ARRAYS
        let myArray = [];
        myArray[0]=Date.now() //give date
        console.log(myArray[0]);
        
        myArray[1]=function(){console.log('array inside function');}; //Functions
        console.log(myArray[1]());
        

        myObj={name:'Rishi', age:25};
        myArray[2]=myObj;
        console.log(myArray[2]);
        

        //PRACTICE CODE
        //1. WHAT IS OUTPUT
        const arrayOfOddNumbers=[1,3,5];
        arrayOfOddNumbers[100]=199;
        console.log(arrayOfOddNumbers.length);


        //JOIN ALL ARRAY INTO STRING
        const myColor = ['1','2','3','string']
        console.log(myColor.toString());  
        console.log(myColor.join());
        

        //
        
    </script>
</body>
</html>
