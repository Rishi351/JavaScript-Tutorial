<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get the value in the Form by Using btn</title>
</head>
<body>
    <div class="container">
        <label for="name">Name</label>
        <input type="text" name="Name" id="Name"><br><br>
        <label for="address">Address</label>
        <input type="text" name="address" id="address"><br><br>
        <button type="button" id="btn">Submit</button>

        <h1>Welcome</h1>
        <h1>Address</h1>
    </div>


    <script>
        var button = document.getElementById('btn');
        button.addEventListener("click", function(e){
            e.preventDefault()
         var name = document.getElementsByTagName('input')[0];
         var address = document.getElementById('address');
     
         var addName = document.getElementsByTagName('h1')[0];
         var addAddress = document.getElementsByTagName('h1')[1];
     
         addName.innerHTML += "-" + name.value;
         addAddress.innerHTML += "-" + address.value;
        })
     </script>
</body>

</html>
